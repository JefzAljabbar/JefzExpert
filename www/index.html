<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var K='jefzexpert.v3',S={name:'JefzGrid',code:'',presets:{},lib:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||localStorage.getItem('jefzexpert.v2')||'{}'))}catch(e){}
S.presets=S.presets||{};S.lib=S.lib||{};
function persist(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function say(t,c){var m=$('#msg');m.textContent=t;m.style.color=c||''}
/* ---------- EA generator (MQL4) ---------- */
function ea(p){return `//+------------------------------------------------------------------+
//| ${p.name}.mq4 - dibuat JefzExpert
//| Grid + Martingale + trailing order stop
//+------------------------------------------------------------------+
#property copyright "JefzExpert"
#property strict

extern int    MagicNumber   = ${p.magic};
extern double StartLot      = ${p.lot};     // lot awal
extern double LotMultiplier = ${p.mul};     // pengali lot tiap level
extern int    MaxLevels     = ${p.lv};      // maks posisi per keranjang
extern double MaxLot        = ${p.maxlot};  // batas lot per order
extern int    GridStep      = ${p.grid};    // jarak antar level (poin)
extern int    EntryDistance = ${p.entry};   // jarak order stop dari harga (poin)
extern int    TrailStep     = ${p.trail};   // geser order stop bila harga menjauh sejauh ini (poin)
extern double BasketTP      = ${p.tp};      // target profit keranjang (mata uang akun)
extern double EquityStopPct = ${p.eq};      // tutup semua bila ekuitas turun x% dari balance (0 = mati)
extern int    MaxSpread     = ${p.spr};     // maks spread untuk pasang order (poin)
extern int    Slippage      = 5;

bool Halted = false;

int OnInit(){ return(INIT_SUCCEEDED); }

double NormLot(double lot)
{
   double st = MarketInfo(Symbol(), MODE_LOTSTEP);
   double mn = MarketInfo(Symbol(), MODE_MINLOT);
   double mx = MarketInfo(Symbol(), MODE_MAXLOT);
   if(st <= 0) st = 0.01;
   lot = MathFloor(lot / st + 0.0000001) * st;
   if(lot > MaxLot) lot = MaxLot;
   if(lot > mx) lot = mx;
   if(lot < mn) lot = mn;
   return(NormalizeDouble(lot, 3));
}

double EntryDist()
{
   double d = EntryDistance * Point;
   double m = (MarketInfo(Symbol(), MODE_STOPLEVEL) + 2) * Point;
   if(d < m) d = m;
   return(d);
}

void Scan(int &mkt, int &pend, int &dir, double &lastLot, double &lastPrice, double &profit)
{
   mkt = 0; pend = 0; dir = -1; lastLot = 0; lastPrice = 0; profit = 0;
   int lastTicket = 0;
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      if(t == OP_BUY || t == OP_SELL)
      {
         mkt++;
         dir = t;
         profit += OrderProfit() + OrderSwap() + OrderCommission();
         if(OrderTicket() > lastTicket)
         {
            lastTicket = OrderTicket();
            lastLot = OrderLots();
            lastPrice = OrderOpenPrice();
         }
      }
      else pend++;
   }
}

void CloseAll()
{
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      RefreshRates();
      if(t == OP_BUY)
      {
         if(!OrderClose(OrderTicket(), OrderLots(), Bid, Slippage, clrNONE)) Print("Close gagal: ", GetLastError());
      }
      else if(t == OP_SELL)
      {
         if(!OrderClose(OrderTicket(), OrderLots(), Ask, Slippage, clrNONE)) Print("Close gagal: ", GetLastError());
      }
      else if(!OrderDelete(OrderTicket())) Print("Delete gagal: ", GetLastError());
   }
}

void DeletePendings()
{
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      if(t == OP_BUYSTOP || t == OP_SELLSTOP || t == OP_BUYLIMIT || t == OP_SELLLIMIT)
         if(!OrderDelete(OrderTicket())) Print("Delete gagal: ", GetLastError());
   }
}

void OpenMarket(int type, double lot)
{
   RefreshRates();
   double price = (type == OP_BUY) ? Ask : Bid;
   int tk = OrderSend(Symbol(), type, lot, price, Slippage, 0, 0, "JefzExpert", MagicNumber, 0, (type == OP_BUY) ? clrBlue : clrRed);
   if(tk < 0) Print("OrderSend gagal: ", GetLastError());
}

void PlacePendings()
{
   double d = EntryDist();
   double lot = NormLot(StartLot);
   if(OrderSend(Symbol(), OP_BUYSTOP, lot, NormalizeDouble(Ask + d, Digits), Slippage, 0, 0, "JefzExpert", MagicNumber, 0, clrBlue) < 0)
      Print("BuyStop gagal: ", GetLastError());
   if(OrderSend(Symbol(), OP_SELLSTOP, lot, NormalizeDouble(Bid - d, Digits), Slippage, 0, 0, "JefzExpert", MagicNumber, 0, clrRed) < 0)
      Print("SellStop gagal: ", GetLastError());
}

void TrailPendings()
{
   double d = EntryDist();
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      if(t == OP_BUYSTOP)
      {
         double nb = NormalizeDouble(Ask + d, Digits);
         if(OrderOpenPrice() - nb >= TrailStep * Point)
            if(!OrderModify(OrderTicket(), nb, 0, 0, 0, clrBlue)) Print("Modify gagal: ", GetLastError());
      }
      else if(t == OP_SELLSTOP)
      {
         double ns = NormalizeDouble(Bid - d, Digits);
         if(ns - OrderOpenPrice() >= TrailStep * Point)
            if(!OrderModify(OrderTicket(), ns, 0, 0, 0, clrRed)) Print("Modify gagal: ", GetLastError());
      }
   }
}

void OnTick()
{
   if(Halted) return;
   if(EquityStopPct > 0 && AccountEquity() < AccountBalance() * (1.0 - EquityStopPct / 100.0))
   {
      CloseAll();
      Halted = true;
      Alert(WindowExpertName(), ": stop ekuitas tercapai, EA berhenti.");
      return;
   }
   int mkt = 0, pend = 0, dir = -1;
   double lastLot = 0, lastPrice = 0, profit = 0;
   Scan(mkt, pend, dir, lastLot, lastPrice, profit);
   if(mkt == 0)
   {
      if(pend == 0) { if((Ask - Bid) / Point <= MaxSpread) PlacePendings(); }
      else TrailPendings();
      return;
   }
   if(pend > 0) DeletePendings();
   if(profit >= BasketTP) { CloseAll(); return; }
   if(mkt >= MaxLevels) return;
   double lot = NormLot(lastLot * LotMultiplier);
   double step = GridStep * Point;
   if(dir == OP_BUY && Ask <= lastPrice - step) OpenMarket(OP_BUY, lot);
   if(dir == OP_SELL && Bid >= lastPrice + step) OpenMarket(OP_SELL, lot);
}
`}

/* ---------- potongan kode ---------- */
var SN={
'Kerangka EA kosong':`#property strict

int OnInit(){ return(INIT_SUCCEEDED); }
void OnDeinit(const int reason){}
void OnTick()
{

}
`,
'Lot dari risiko %':`double LotByRisk(double riskPct, int slPoints)
{
   double tv = MarketInfo(Symbol(), MODE_TICKVALUE);
   double ts = MarketInfo(Symbol(), MODE_TICKSIZE);
   double stp = MarketInfo(Symbol(), MODE_LOTSTEP);
   double mn = MarketInfo(Symbol(), MODE_MINLOT);
   if(tv <= 0 || ts <= 0 || stp <= 0 || slPoints <= 0) return(mn);
   double pointVal = tv * Point / ts;
   double lot = (AccountBalance() * riskPct / 100.0) / (slPoints * pointVal);
   return(MathMax(mn, MathFloor(lot / stp) * stp));
}
`,
'Trailing stop posisi':`void TrailPositions(int magic, int startPts, int stepPts)
{
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != magic) continue;
      if(OrderType() == OP_BUY && Bid - OrderOpenPrice() >= startPts * Point)
      {
         double sl = NormalizeDouble(Bid - stepPts * Point, Digits);
         if(sl > OrderStopLoss()) OrderModify(OrderTicket(), OrderOpenPrice(), sl, OrderTakeProfit(), 0, clrNONE);
      }
      if(OrderType() == OP_SELL && OrderOpenPrice() - Ask >= startPts * Point)
      {
         double sl2 = NormalizeDouble(Ask + stepPts * Point, Digits);
         if(OrderStopLoss() == 0 || sl2 < OrderStopLoss()) OrderModify(OrderTicket(), OrderOpenPrice(), sl2, OrderTakeProfit(), 0, clrNONE);
      }
   }
}
`,
'Filter jam trading':`bool InHours(int fromHour, int toHour)
{
   int h = TimeHour(TimeCurrent());
   if(fromHour <= toHour) return(h >= fromHour && h < toHour);
   return(h >= fromHour || h < toHour);
}
`,
'Cek spread':`bool SpreadOK(int maxPts)
{
   return((Ask - Bid) / Point <= maxPts);
}
`};

function lint(c){
  var o=[],s=[],i=0,ln=1,pr={')':'(',']':'[','}':'{'};
  while(i<c.length){var ch=c[i],n=c[i+1];
    if(ch==='\n'){ln++;i++;continue}
    if(ch==='/'&&n==='/'){while(i<c.length&&c[i]!=='\n')i++;continue}
    if(ch==='/'&&n==='*'){i+=2;while(i<c.length&&!(c[i]==='*'&&c[i+1]==='/')){if(c[i]==='\n')ln++;i++}i+=2;continue}
    if(ch==='"'||ch==="'"){var q=ch;i++;while(i<c.length&&c[i]!==q&&c[i]!=='\n'){if(c[i]==='\\')i++;i++}if(c[i]!==q)o.push('Baris '+ln+': tanda kutip tidak ditutup');i++;continue}
    if('([{'.indexOf(ch)>=0)s.push([ch,ln]);
    else if(')]}'.indexOf(ch)>=0){var t=s.pop();if(!t||t[0]!==pr[ch])o.push('Baris '+ln+': "'+ch+'" tidak cocok')}
    i++}
  s.forEach(function(t){o.push('Baris '+t[1]+': "'+t[0]+'" tidak ditutup')});
  if(!/\bOnTick\s*\(|\bstart\s*\(/.test(c))o.push('Tidak ada OnTick() atau start().');
  if(/\b(CTrade|PositionSelect|PositionGetDouble|MqlTradeRequest)\b/.test(c))o.push('Terdeteksi sintaks MQL5. MT4 butuh MQL4.');
  return o}


/* ---------- mode MQL4 + kamus ---------- */
var API={Order:'OrderSend OrderModify OrderClose OrderDelete OrderSelect OrdersTotal OrderType OrderTicket OrderLots OrderOpenPrice OrderStopLoss OrderTakeProfit OrderProfit OrderSwap OrderCommission OrderMagicNumber OrderSymbol OrderOpenTime OrderComment',
Akun:'AccountBalance AccountEquity AccountFreeMargin',
Pasar:'MarketInfo Bid Ask Point Digits Symbol RefreshRates',
Matematika:'MathAbs MathMax MathMin MathFloor MathCeil MathPow MathRound NormalizeDouble',
Util:'Print Alert Comment GetLastError TimeCurrent DoubleToString IntegerToString',
Konstanta:'OP_BUY OP_SELL OP_BUYSTOP OP_SELLSTOP OP_BUYLIMIT OP_SELLLIMIT SELECT_BY_POS SELECT_BY_TICKET MODE_TRADES MODE_POINT MODE_STOPLEVEL MODE_LOTSTEP MODE_MINLOT MODE_MAXLOT MODE_TICKVALUE MODE_TICKSIZE clrBlue clrRed clrNONE INIT_SUCCEEDED'};
var ALL=Object.keys(API).map(function(k){return API[k]}).join(' ');
function W(s){var o={};s.split(' ').forEach(function(w){o[w]=true});return o}
if(window.CodeMirror)CodeMirror.defineMIME('text/x-mql4',{name:'clike',keywords:W('extern input static const if else for while do switch case default break continue return true false'),types:W('int double bool string datetime color void long uint char short'),builtin:W(ALL),atoms:W('NULL'),hooks:{'#':function(s){s.skipToEnd();return 'meta'}}});
function defaultEA(){return ea({name:'JefzGrid',magic:20261124,lot:0.01,mul:2,lv:6,maxlot:1,grid:200,entry:150,trail:50,tp:5,eq:30,spr:30})}

var cm;
if(window.CodeMirror){cm=CodeMirror.fromTextArea($('#ed'),{mode:'text/x-mql4',lineNumbers:true,indentUnit:3,tabSize:3})}
else{
  var ta=$('#ed'),fire=function(){ta.dispatchEvent(new Event('input'))};
  cm={getValue:function(){return ta.value},setValue:function(v){ta.value=v;fire()},
    replaceSelection:function(t){ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,'end');fire()},
    replaceRange:function(t,a,b){ta.setRangeText(t,a.i,(b||a).i,'end');fire()},
    posFromIndex:function(i){return{i:i}},
    setCursor:function(p){ta.focus();ta.setSelectionRange(p.i,p.i);ta.scrollTop=Math.max(0,(ta.value.slice(0,p.i).split('\n').length-1)*19-60)},
    focus:function(){ta.focus()},lineCount:function(){return ta.value.split('\n').length},
    on:function(e,f){if(e==='change')ta.addEventListener('input',f)}};
  say('Mode sederhana tanpa warna: folder cm/ tidak ditemukan.','var(--am)');
}
cm.setValue(S.code||SN['Kerangka EA kosong']);$('#nm').value=S.name;
function info(){$('#inf').textContent=cm.lineCount()+' baris'}
cm.on('change',function(){S.code=cm.getValue();persist();info()});info();
$('#nm').addEventListener('input',function(){S.name=this.value;persist()});
function fname(){return (S.name||'EA').replace(/[^\w-]/g,'_')+'.mq4'}

/* ---------- parser fungsi ---------- */
function fns(code){
  code=code==null?cm.getValue():code;
  var r=[],d=0,i=0,n=code.length,head=0,cand=null;
  while(i<n){var c=code[i],x=code[i+1];
    if(c==='/'&&x==='/'){while(i<n&&code[i]!=='\n')i++;continue}
    if(c==='/'&&x==='*'){i=code.indexOf('*/',i+2);i=i<0?n:i+2;continue}
    if(c==='"'||c==="'"){var q=c;i++;while(i<n&&code[i]!==q&&code[i]!=='\n'){if(code[i]==='\\')i++;i++}i++;continue}
    if(c==='{'){
      if(d===0){var h=code.slice(head,i),m=/(^|\n)[ \t]*((?:[A-Za-z_]\w*[ \t]+)+([A-Za-z_]\w*)[ \t]*\([^)]*\))\s*(?:\/\/[^\n]*\s*)*$/.exec(h);
        cand=m?{name:m[3],start:head+m.index+m[1].length}:null}
      d++}
    else if(c==='}'){d--;if(d===0){if(cand){cand.end=i+1;cand.start+=code.slice(cand.start).search(/\S/);r.push(cand);cand=null}head=i+1}}
    else if(c===';'&&d===0)head=i+1;
    i++}
  return r}

/* ---------- modal ---------- */
function el(t,p,k){var e=document.createElement(t);if(p)for(var a in p)e[a]=p[a];(k||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function modal(title,build){var m=$('#md');m.textContent='';m.appendChild(el('h3',{textContent:title}));build(m);$('#ov').classList.add('on')}
function close(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',function(e){if(e.target===this)close()});
function btn(t,f,c){return el('button',{textContent:t,onclick:f,className:c||''})}
function ask(text,yes){return new Promise(function(res){modal('Konfirmasi',function(m){m.appendChild(el('p',{textContent:text}));m.appendChild(el('div',{className:'bt'},[btn('Batal',function(){close();res(false)}),btn(yes||'Ya, lanjut',function(){close();res(true)},'ok')]))})})}
function nameBox(title,val){return new Promise(function(res){modal(title,function(m){var i=el('input',{value:val||''});i.style.width='100%';m.appendChild(i);m.appendChild(el('div',{className:'bt'},[btn('Batal',function(){close();res(null)}),btn('Simpan',function(){var v=i.value.trim();if(v){close();res(v)}},'ok')]));setTimeout(function(){i.focus()},60)})})}

/* ---------- preset ---------- */

  Object.keys(SN).forEach(function(k){if(k!=='Kerangka EA kosong')BI.push({n:k,t:'fn',c:SN[k]})})})();

             :btn('Sisipkan',function(){put('\n'+b.c+'\n')})]))});
  m.appendChild(el('h3',{textContent:'Preset saya',style:'margin-top:12px'}));
  var ks=Object.keys(S.presets);if(!ks.length)m.appendChild(el('div',{className:'mu',textContent:'Belum ada.'}));
  ks.forEach(function(k){m.appendChild(el('div',{className:'r'},[el('span',{textContent:k}),

    btn('Hapus',async function(){if(await ask('Hapus preset "'+k+'"?','Ya, hapus')){delete S.presets[k];persist()}presetUI()})]))})})}

/* ---------- fungsi ---------- */
function fnUI(){var F=fns();modal('Fungsi',function(m){
  m.appendChild(el('div',{className:'mu',textContent:'Di EA ini (ketuk nama untuk lompat):'}));
  if(!F.length)m.appendChild(el('div',{className:'mu',textContent:'Belum ada fungsi.'}));
  F.forEach(function(f){m.appendChild(el('div',{className:'r'},[
    el('span',{textContent:f.name,onclick:function(){close();cm.setCursor(cm.posFromIndex(f.start));cm.focus()}}),
    btn('Ke pustaka',async function(){var t=cm.getValue().slice(f.start,f.end);if(S.lib[f.name]&&!(await ask('Pustaka sudah punya "'+f.name+'". Timpa?'))){fnUI();return}S.lib[f.name]=t;persist();say('Masuk pustaka: '+f.name,'var(--ok)');fnUI()}),
    btn('Hapus',async function(){if(await ask('Hapus fungsi "'+f.name+'" dari editor?','Ya, hapus')){var g=fns().filter(function(x){return x.name===f.name})[0];if(g)cm.replaceRange('',cm.posFromIndex(g.start),cm.posFromIndex(g.end))}fnUI()})]))});
  m.appendChild(el('h3',{textContent:'Pustaka fungsi',style:'margin-top:14px'}));
  var L=Object.keys(S.lib);if(!L.length)m.appendChild(el('div',{className:'mu',textContent:'Kosong. Pakai "Ke pustaka" di atas.'}));
  L.forEach(function(k){m.appendChild(el('div',{className:'r'},[el('span',{textContent:k}),btn('Sisipkan',function(){put('\n'+S.lib[k]+'\n')}),btn('Hapus',async function(){if(await ask('Hapus "'+k+'" dari pustaka?','Ya, hapus')){delete S.lib[k];persist()}fnUI()})]))});
  m.appendChild(el('h3',{textContent:'Sisipkan kode MQL4',style:'margin-top:14px'}));
  var g=el('div',{className:'bt',style:'flex-wrap:wrap'});
  Object.keys(API).forEach(function(k){var s=el('select',{});s.appendChild(el('option',{textContent:k,value:''}));API[k].split(' ').forEach(function(n){s.appendChild(el('option',{textContent:n,value:n}))});s.onchange=function(){if(s.value)put(s.value+(k==='Konstanta'||/^(Bid|Ask|Point|Digits)$/.test(s.value)?'':'('))};g.appendChild(s)});
  var sp=el('select',{});sp.appendChild(el('option',{textContent:'Potongan kode',value:''}));Object.keys(SN).forEach(function(k){sp.appendChild(el('option',{textContent:k,value:k}))});sp.onchange=function(){if(sp.value)put(SN[sp.value])};g.appendChild(sp);
  m.appendChild(g)})}

/* ---------- impor / ekspor ---------- */
async function shareText(fn,text){var P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){try{var r=await P.Filesystem.writeFile({path:fn,data:text,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:fn,url:r.uri,dialogTitle:'Simpan atau kirim '+fn});return}catch(e){say('Gagal membagikan: '+(e.message||e),'var(--er)')}}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();say('Diunduh: '+fn,'var(--ok)')}
function ieUI(){modal('Impor / Ekspor fungsi',function(m){m.appendChild(el('div',{className:'bt'},[btn('Ekspor...',exportUI),btn('Impor...',function(){close();$('#file').click()})]))})}
function exportUI(){var code=cm.getValue(),rows=[];
  fns().forEach(function(f){rows.push({n:f.name,t:code.slice(f.start,f.end),s:'EA'})});
  Object.keys(S.lib).forEach(function(k){rows.push({n:k,t:S.lib[k],s:'pustaka'})});
  modal('Ekspor fungsi',function(m){
    if(!rows.length)m.appendChild(el('div',{className:'mu',textContent:'Belum ada fungsi.'}));
    rows.forEach(function(r){r.c=el('input',{type:'checkbox'});m.appendChild(el('label',{className:'r'},[r.c,el('span',{textContent:r.n+' ('+r.s+')'})]))});
    m.appendChild(el('div',{className:'bt'},[btn('Batal',close),btn('Simpan .mqh',function(){var sel=rows.filter(function(r){return r.c.checked});if(!sel.length){say('Pilih minimal satu fungsi.','var(--er)');return}close();shareText((S.name||'EA').replace(/[^\w-]/g,'_')+'_fungsi.mqh','// Fungsi dari JefzExpert\n\n'+sel.map(function(r){return r.t}).join('\n\n')+'\n')},'ok')]))})}
function place(txt,pl){var code=cm.getValue(),F=fns(code),a=pl.split(':'),k=a[0],f=F.filter(function(x){return x.name===a[1]})[0];
  if(k==='rep'&&f)return cm.replaceRange(txt,cm.posFromIndex(f.start),cm.posFromIndex(f.end));
  if(k==='before'&&f)return cm.replaceRange(txt+'\n\n',cm.posFromIndex(f.start));
  if(k==='after'&&f)return cm.replaceRange('\n\n'+txt,cm.posFromIndex(f.end));
  if(k==='start'&&F.length)return cm.replaceRange(txt+'\n\n',cm.posFromIndex(F[0].start));
  cm.replaceRange('\n\n'+txt+'\n',cm.posFromIndex(code.length))}
function importUI(text,list){var EF=fns();modal('Impor fungsi',function(m){
  m.appendChild(el('div',{className:'mu',textContent:'Pilih fungsi dan tempatnya di editor:'}));
  var rows=list.map(function(f){var s=el('select',{});function o(v,t){s.appendChild(el('option',{value:v,textContent:t}))}
    o('end','Di akhir');o('start','Di awal');EF.forEach(function(e){o('before:'+e.name,'Sebelum '+e.name);o('after:'+e.name,'Sesudah '+e.name);o('rep:'+e.name,'Ganti '+e.name)});
    s.value=EF.some(function(e){return e.name===f.name})?'rep:'+f.name:'end';
    var c=el('input',{type:'checkbox',checked:true});m.appendChild(el('label',{className:'r'},[c,el('span',{textContent:f.name}),s]));return{f:f,c:c,s:s}});
  m.appendChild(el('div',{className:'bt'},[btn('Batal',close),btn('Terapkan',async function(){
    var sel=rows.filter(function(r){return r.c.checked});if(!sel.length)return;
    var rep=sel.filter(function(r){return r.s.value.indexOf('rep:')===0}).map(function(r){return r.f.name});
    if(rep.length&&!(await ask('Fungsi ini akan ditimpa: '+rep.join(', ')+'. Lanjut?'))){importUI(text,list);return}
    sel.forEach(function(r){place(text.slice(r.f.start,r.f.end),r.s.value)});close();say('Diimpor: '+sel.length+' fungsi','var(--ok)')},'ok')]));
  m.appendChild(el('div',{className:'bt'},[btn('Ganti seluruh editor dengan file ini',async function(){if(await ask('Seluruh isi editor akan tertimpa file ini. Lanjut?')){cm.setValue(text);close()}else importUI(text,list)})]))})}
$('#file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var t=String(r.result),l=fns(t);if(!l.length){modal('Impor',function(m){m.appendChild(el('p',{textContent:'Tidak ada fungsi ditemukan di file ini.'}));m.appendChild(btn('Tutup',close))});return}importUI(t,l)};r.readAsText(f);e.target.value=''});

/* ---------- tombol ---------- */
$('#bPre').addEventListener('click',presetUI);$('#bFn').addEventListener('click',fnUI);$('#bIE').addEventListener('click',ieUI);
$('#bSave').addEventListener('click',function(){shareText(fname(),cm.getValue())});
$('#bCopy').addEventListener('click',function(){var t=cm.getValue();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){say('Kode disalin.','var(--ok)')},function(){say('Gagal menyalin.','var(--er)')});else say('Salin tidak didukung.','var(--er)')});
$('#bChk').addEventListener('click',function(){var r=lint(cm.getValue());modal('Hasil cek',function(m){if(!r.length)m.appendChild(el('p',{textContent:'Kurung, kutip, dan OnTick() beres. Kompilasi penuh tetap di MetaEditor (F7).'}));r.forEach(function(x){m.appendChild(el('div',{className:'r',textContent:x}))});m.appendChild(btn('Tutup',close))})});

/* ---------- dropdown otomatis ---------- */
cm.on('inputRead',function(c,ch){if(!/\w/.test(ch.text[0]||''))return;
  c.showHint({completeSingle:false,hint:function(c){var cur=c.getCursor(),tk=c.getTokenAt(cur),w=tk.string;if(!/^\w{2,}$/.test(w))return;
    var all=ALL.split(' ').concat(fns().map(function(f){return f.name}));
    var l=all.filter(function(n){return n!==w&&n.toLowerCase().indexOf(w.toLowerCase())===0});
    return l.length?{list:l,from:CodeMirror.Pos(cur.line,tk.start),to:CodeMirror.Pos(cur.line,tk.end)}:undefined}})});

})();
</script>
