<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var K='jefzexpert.v3',S={name:'JefzGrid',code:'',presets:{},lib:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||localStorage.getItem('jefzexpert.v2')||'{}'))}catch(e){}
S.presets=S.presets||{};S.lib=S.lib||{};
function persist(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function say(t,c){var m=$('#msg');m.textContent=t;m.style.color=c||''}
/* ---------- EA generator (MQL4) ---------- */
function ea(p){return `//+------------------------------------------------------------------+
//| ${p.name}.mq4 - dibuat JefzExpert
//| Grid + Martingale + trailing order stop
//+------------------------------------------------------------------+
#property copyright "JefzExpert"
#property strict

extern int    MagicNumber   = ${p.magic};
extern double StartLot      = ${p.lot};     // lot awal
extern double LotMultiplier = ${p.mul};     // pengali lot tiap level
extern int    MaxLevels     = ${p.lv};      // maks posisi per keranjang
extern double MaxLot        = ${p.maxlot};  // batas lot per order
extern int    GridStep      = ${p.grid};    // jarak antar level (poin)
extern int    EntryDistance = ${p.entry};   // jarak order stop dari harga (poin)
extern int    TrailStep     = ${p.trail};   // geser order stop bila harga menjauh sejauh ini (poin)
extern double BasketTP      = ${p.tp};      // target profit keranjang (mata uang akun)
extern double EquityStopPct = ${p.eq};      // tutup semua bila ekuitas turun x% dari balance (0 = mati)
extern int    MaxSpread     = ${p.spr};     // maks spread untuk pasang order (poin)
extern int    Slippage      = 5;

bool Halted = false;

int OnInit(){ return(INIT_SUCCEEDED); }

double NormLot(double lot)
{
   double st = MarketInfo(Symbol(), MODE_LOTSTEP);
   double mn = MarketInfo(Symbol(), MODE_MINLOT);
   double mx = MarketInfo(Symbol(), MODE_MAXLOT);
   if(st <= 0) st = 0.01;
   lot = MathFloor(lot / st + 0.0000001) * st;
   if(lot > MaxLot) lot = MaxLot;
   if(lot > mx) lot = mx;
   if(lot < mn) lot = mn;
   return(NormalizeDouble(lot, 3));
}

double EntryDist()
{
   double d = EntryDistance * Point;
   double m = (MarketInfo(Symbol(), MODE_STOPLEVEL) + 2) * Point;
   if(d < m) d = m;
   return(d);
}

void Scan(int &mkt, int &pend, int &dir, double &lastLot, double &lastPrice, double &profit)
{
   mkt = 0; pend = 0; dir = -1; lastLot = 0; lastPrice = 0; profit = 0;
   int lastTicket = 0;
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      if(t == OP_BUY || t == OP_SELL)
      {
         mkt++;
         dir = t;
         profit += OrderProfit() + OrderSwap() + OrderCommission();
         if(OrderTicket() > lastTicket)
         {
            lastTicket = OrderTicket();
            lastLot = OrderLots();
            lastPrice = OrderOpenPrice();
         }
      }
      else pend++;
   }
}

void CloseAll()
{
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      RefreshRates();
      if(t == OP_BUY)
      {
         if(!OrderClose(OrderTicket(), OrderLots(), Bid, Slippage, clrNONE)) Print("Close gagal: ", GetLastError());
      }
      else if(t == OP_SELL)
      {
         if(!OrderClose(OrderTicket(), OrderLots(), Ask, Slippage, clrNONE)) Print("Close gagal: ", GetLastError());
      }
      else if(!OrderDelete(OrderTicket())) Print("Delete gagal: ", GetLastError());
   }
}

void DeletePendings()
{
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      if(t == OP_BUYSTOP || t == OP_SELLSTOP || t == OP_BUYLIMIT || t == OP_SELLLIMIT)
         if(!OrderDelete(OrderTicket())) Print("Delete gagal: ", GetLastError());
   }
}

void OpenMarket(int type, double lot)
{
   RefreshRates();
   double price = (type == OP_BUY) ? Ask : Bid;
   int tk = OrderSend(Symbol(), type, lot, price, Slippage, 0, 0, "JefzExpert", MagicNumber, 0, (type == OP_BUY) ? clrBlue : clrRed);
   if(tk < 0) Print("OrderSend gagal: ", GetLastError());
}

void PlacePendings()
{
   double d = EntryDist();
   double lot = NormLot(StartLot);
   if(OrderSend(Symbol(), OP_BUYSTOP, lot, NormalizeDouble(Ask + d, Digits), Slippage, 0, 0, "JefzExpert", MagicNumber, 0, clrBlue) < 0)
      Print("BuyStop gagal: ", GetLastError());
   if(OrderSend(Symbol(), OP_SELLSTOP, lot, NormalizeDouble(Bid - d, Digits), Slippage, 0, 0, "JefzExpert", MagicNumber, 0, clrRed) < 0)
      Print("SellStop gagal: ", GetLastError());
}

void TrailPendings()
{
   double d = EntryDist();
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != MagicNumber) continue;
      int t = OrderType();
      if(t == OP_BUYSTOP)
      {
         double nb = NormalizeDouble(Ask + d, Digits);
         if(OrderOpenPrice() - nb >= TrailStep * Point)
            if(!OrderModify(OrderTicket(), nb, 0, 0, 0, clrBlue)) Print("Modify gagal: ", GetLastError());
      }
      else if(t == OP_SELLSTOP)
      {
         double ns = NormalizeDouble(Bid - d, Digits);
         if(ns - OrderOpenPrice() >= TrailStep * Point)
            if(!OrderModify(OrderTicket(), ns, 0, 0, 0, clrRed)) Print("Modify gagal: ", GetLastError());
      }
   }
}

void OnTick()
{
   if(Halted) return;
   if(EquityStopPct > 0 && AccountEquity() < AccountBalance() * (1.0 - EquityStopPct / 100.0))
   {
      CloseAll();
      Halted = true;
      Alert(WindowExpertName(), ": stop ekuitas tercapai, EA berhenti.");
      return;
   }
   int mkt = 0, pend = 0, dir = -1;
   double lastLot = 0, lastPrice = 0, profit = 0;
   Scan(mkt, pend, dir, lastLot, lastPrice, profit);
   if(mkt == 0)
   {
      if(pend == 0) { if((Ask - Bid) / Point <= MaxSpread) PlacePendings(); }
      else TrailPendings();
      return;
   }
   if(pend > 0) DeletePendings();
   if(profit >= BasketTP) { CloseAll(); return; }
   if(mkt >= MaxLevels) return;
   double lot = NormLot(lastLot * LotMultiplier);
   double step = GridStep * Point;
   if(dir == OP_BUY && Ask <= lastPrice - step) OpenMarket(OP_BUY, lot);
   if(dir == OP_SELL && Bid >= lastPrice + step) OpenMarket(OP_SELL, lot);
}
`}

/* ---------- potongan kode ---------- */
var SN={
'Kerangka EA kosong':`#property strict

int OnInit(){ return(INIT_SUCCEEDED); }
void OnDeinit(const int reason){}
void OnTick()
{

}
`,
'Lot dari risiko %':`double LotByRisk(double riskPct, int slPoints)
{
   double tv = MarketInfo(Symbol(), MODE_TICKVALUE);
   double ts = MarketInfo(Symbol(), MODE_TICKSIZE);
   double stp = MarketInfo(Symbol(), MODE_LOTSTEP);
   double mn = MarketInfo(Symbol(), MODE_MINLOT);
   if(tv <= 0 || ts <= 0 || stp <= 0 || slPoints <= 0) return(mn);
   double pointVal = tv * Point / ts;
   double lot = (AccountBalance() * riskPct / 100.0) / (slPoints * pointVal);
   return(MathMax(mn, MathFloor(lot / stp) * stp));
}
`,
'Trailing stop posisi':`void TrailPositions(int magic, int startPts, int stepPts)
{
   for(int i = OrdersTotal() - 1; i >= 0; i--)
   {
      if(!OrderSelect(i, SELECT_BY_POS, MODE_TRADES)) continue;
      if(OrderSymbol() != Symbol() || OrderMagicNumber() != magic) continue;
      if(OrderType() == OP_BUY && Bid - OrderOpenPrice() >= startPts * Point)
      {
         double sl = NormalizeDouble(Bid - stepPts * Point, Digits);
         if(sl > OrderStopLoss()) OrderModify(OrderTicket(), OrderOpenPrice(), sl, OrderTakeProfit(), 0, clrNONE);
      }
      if(OrderType() == OP_SELL && OrderOpenPrice() - Ask >= startPts * Point)
      {
         double sl2 = NormalizeDouble(Ask + stepPts * Point, Digits);
         if(OrderStopLoss() == 0 || sl2 < OrderStopLoss()) OrderModify(OrderTicket(), OrderOpenPrice(), sl2, OrderTakeProfit(), 0, clrNONE);
      }
   }
}
`,
'Filter jam trading':`bool InHours(int fromHour, int toHour)
{
   int h = TimeHour(TimeCurrent());
   if(fromHour <= toHour) return(h >= fromHour && h < toHour);
   return(h >= fromHour || h < toHour);
}
`,
'Cek spread':`bool SpreadOK(int maxPts)
{
   return((Ask - Bid) / Point <= maxPts);
}
`};

function lint(c){
  var o=[],s=[],i=0,ln=1,pr={')':'(',']':'[','}':'{'};
  while(i<c.length){var ch=c[i],n=c[i+1];
    if(ch==='\n'){ln++;i++;continue}
    if(ch==='/'&&n==='/'){while(i<c.length&&c[i]!=='\n')i++;continue}
    if(ch==='/'&&n==='*'){i+=2;while(i<c.length&&!(c[i]==='*'&&c[i+1]==='/')){if(c[i]==='\n')ln++;i++}i+=2;continue}
    if(ch==='"'||ch==="'"){var q=ch;i++;while(i<c.length&&c[i]!==q&&c[i]!=='\n'){if(c[i]==='\\')i++;i++}if(c[i]!==q)o.push('Baris '+ln+': tanda kutip tidak ditutup');i++;continue}
    if('([{'.indexOf(ch)>=0)s.push([ch,ln]);
    else if(')]}'.indexOf(ch)>=0){var t=s.pop();if(!t||t[0]!==pr[ch])o.push('Baris '+ln+': "'+ch+'" tidak cocok')}
    i++}
  s.forEach(function(t){o.push('Baris '+t[1]+': "'+t[0]+'" tidak ditutup')});
  if(!/\bOnTick\s*\(|\bstart\s*\(/.test(c))o.push('Tidak ada OnTick() atau start().');
  if(/\b(CTrade|PositionSelect|PositionGetDouble|MqlTradeRequest)\b/.test(c))o.push('Terdeteksi sintaks MQL5. MT4 butuh MQL4.');
  return o}



/* ===== penerjemah MQL4 + mesin order (tanpa DOM) ===== */
var MQL=(function(){
var TYPES={int:1,double:1,bool:1,string:1,datetime:1,color:1,void:1,long:1,uint:1,char:1,short:1,float:1,ulong:1};
var INTS={int:1,long:1,uint:1,char:1,short:1,datetime:1,color:1,ulong:1};
function err(m,ln){var e=new Error((ln?'Baris '+ln+': ':'')+m);e.ln=ln;return e}
function lex(src){
  var re=/(\s+|\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)|(0[xX][0-9a-fA-F]+|\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])*')|([A-Za-z_]\w*)|(\+\+|--|\+=|-=|\*=|\/=|==|!=|<=|>=|&&|\|\||[-+*\/%=<>!&?:;,(){}\[\]])/y;
  var t=[],ln=1,m;
  while(re.lastIndex<src.length){
    var s=re.lastIndex;m=re.exec(src);
    if(!m)throw err('Karakter tidak dikenal: '+src[s],ln);
    if(m[1]!==undefined){ln+=(m[1].match(/\n/g)||[]).length;continue}
    var k={ln:ln};
    if(m[2]!==undefined){k.k='n';k.v=Number(m[2])}
    else if(m[3]!==undefined){k.k='s';k.v=m[3].slice(1,-1).replace(/\\n/g,'\n').replace(/\\(.)/g,'$1')}
    else if(m[4]!==undefined){k.k='n';k.v=m[4].charCodeAt(1)}
    else if(m[5]!==undefined){k.k='i';k.v=m[5]}
    else{k.k='o';k.v=m[6]}
    t.push(k)}
  t.push({k:'e',v:'<akhir>',ln:ln});return t}

function parse(src){
  var T=lex(src),p=0,fn={},gl=[];
  function is(v){return T[p].k==='o'&&T[p].v===v}
  function eat(v){if(is(v)){p++;return true}return false}
  function need(v){if(!eat(v))throw err('Diharapkan "'+v+'" tetapi ada "'+T[p].v+'"',T[p].ln)}
  function isType(){return T[p].k==='i'&&TYPES[T[p].v]===1}
  function mods(){while(T[p].k==='i'&&/^(extern|input|static|const)$/.test(T[p].v))p++}
  function decl(ty){var v=[];do{var n=T[p++];if(n.k!=='i')throw err('Nama variabel diharapkan',n.ln);var d={n:n.v};
      if(eat('[')){d.arr=is(']')?true:expr();need(']')}
      if(eat('='))d.init=asg();v.push(d)}while(eat(','));need(';');return{t:'decl',ty:ty,v:v}}
  function func(ty,nm){need('(');var ps=[];
    if(!is(')')){do{mods();if(T[p].k==='i'&&T[p].v==='void'&&T[p+1].v===')'){p++;break}
      if(!isType())throw err('Tipe parameter diharapkan',T[p].ln);var q={ty:T[p++].v};if(eat('&'))q.ref=1;q.n=T[p++].v;if(eat('[')){need(']')}if(eat('='))q.def=asg();ps.push(q)}while(eat(','))}
    need(')');return{n:nm.v,ty:ty,ps:ps,body:blk()}}
  function blk(){need('{');var b=[];while(!is('}')){if(T[p].k==='e')throw err('Kurung { tidak ditutup',T[p].ln);b.push(stmt())}p++;return{t:'blk',b:b}}
  function stmt(){var t=T[p];
    if(is('{'))return blk();
    if(eat(';'))return{t:'nop'};
    if(t.k==='i'){
      if(t.v==='if'){p++;need('(');var c=expr();need(')');var a=stmt(),b=null;if(T[p].k==='i'&&T[p].v==='else'){p++;b=stmt()}return{t:'if',c:c,a:a,b:b,ln:t.ln}}
      if(t.v==='for'){p++;need('(');var i=null;if(!eat(';')){if(isType()||/^(static|const)$/.test(T[p].v)){mods();i=decl(T[p++].v)}else{i={t:'expr',e:expr()};need(';')}}
        var c2=is(';')?null:expr();need(';');var s=is(')')?null:expr();need(')');return{t:'for',i:i,c:c2,s:s,b:stmt(),ln:t.ln}}
      if(t.v==='while'){p++;need('(');var c3=expr();need(')');return{t:'while',c:c3,b:stmt(),ln:t.ln}}
      if(t.v==='return'){p++;var e=is(';')?null:expr();need(';');return{t:'ret',e:e,ln:t.ln}}
      if(t.v==='break'){p++;need(';');return{t:'brk'}}
      if(t.v==='continue'){p++;need(';');return{t:'cnt'}}
      if(TYPES[t.v]===1||/^(static|const)$/.test(t.v)){mods();var ty=T[p++].v;var d=decl(ty);d.ln=t.ln;return d}
    }

function curIdx(){return cm.indexFromPos(cm.getCursor())}
function sugg(){var code=cm.getValue(),i=curIdx(),m=/[A-Za-z_]\w*$/.exec(code.slice(0,i)),box=$('#sg');
  if(!m){box.style.display='none';return}
  var w=m[0],lw=w.toLowerCase(),L=cands().filter(function(c){return c.n!==w&&c.n.toLowerCase().indexOf(lw)===0}).slice(0,6);
  if(!L.length){box.style.display='none';return}
  box.textContent='';
  L.forEach(function(c){var r=el('div',{},[el('b',{textContent:c.n+(c.f?'()':'')}),el('small',{textContent:c.s})]);
    r.addEventListener('pointerdown',function(e){e.preventDefault();var a=i-w.length,t=c.n+(c.f?'()':''),ci=a+c.n.length+(c.f?(c.s?1:2):0);
      cm.replaceRange(t,cm.posFromIndex(a),cm.posFromIndex(i));cm.setCursor(cm.posFromIndex(ci));box.style.display='none';cm.focus()});
    box.appendChild(r)});
  box.style.display='block'}
var PC={s:null,p:[]},mk=[];
function pairs(code){if(PC.s===code)return PC.p;var st=[],r=[],i=0,n=code.length;
  while(i<n){var c=code[i],x=code[i+1];
    if(c==='/'&&x==='/'){while(i<n&&code[i]!=='\n')i++;continue}
    if(c==='/'&&x==='*'){i=code.indexOf('*/',i+2);i=i<0?n:i+2;continue}
    if(c==='"'||c==="'"){var q=c;i++;while(i<n&&code[i]!==q&&code[i]!=='\n'){if(code[i]==='\\')i++;i++}i++;continue}
    if(c==='('||c==='{'||c==='[')st.push([c,i]);
    else if(c===')'||c==='}'||c===']'){var t=st.pop();if(t)r.push({o:t[1],c:i,ch:t[0]})}
    i++}
  PC={s:code,p:r};return r}
function ctx(){var code=cm.getValue(),i=curIdx(),best=null;
  pairs(code).forEach(function(p){if(p.o<i&&i<=p.c&&(!best||p.o>best.o))best=p});
  mk.forEach(function(m){m.clear()});mk=[];
  var t=cm.lineCount()+' baris';
  if(best){var cl={'(':')','{':'}','[':']'}[best.ch];
    if(cm.markText){mk.push(cm.markText(cm.posFromIndex(best.o),cm.posFromIndex(best.o+1),{className:'brk'}));mk.push(cm.markText(cm.posFromIndex(best.c),cm.posFromIndex(best.c+1),{className:'brk'}))}
    var l1=code.slice(0,best.o).split('\n').length,l2=code.slice(0,best.c).split('\n').length,f=fns().filter(function(f){return f.start<=i&&i<=f.end})[0];
    t+=' · di dalam '+best.ch+' '+cl+' (baris '+l1+(l2>l1?'-'+l2:'')+')'+(f?' · '+f.name+'()':'')}
  $('#inf').textContent=t}

var SD={price:2650,spread:150,delay:300,balance:1000,digits:3,point:0.001,contract:100,lotMin:0.01,lotMax:100,lotStep:0.01,stopLevel:0,leverage:500,range:100,ampl:20,period:600,drift:0,pola:'zigzag',seed:1};
var sim=Object.assign({},SD,S.sim||{});
var eng,prog,tape=[],pos=0,eq=[],ghost=null,running=false,auto=true,base={t:0,p:sim.price},speed=20,acc=0,lastTs=0,rw=[0],rs=1;
function cfg(){return Object.assign({sym:'XAUUSD',t0:1700000000},sim)}
function rn(){rs=(rs+0x6D2B79F5)|0;var t=Math.imul(rs^(rs>>>15),1|rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function path(t){var dr=sim.drift/100*t;
  if(sim.pola==='acak'){while(rw.length<=t)rw.push(rw[rw.length-1]+(rn()-.5)*3.46*sim.ampl/Math.sqrt(sim.period));return rw[t]+dr}
  var ph=(t%sim.period)/sim.period;return sim.ampl*(ph<.25?ph*4:ph<.75?2-ph*4:ph*4-4)+dr}
function autoPx(t){return base.p+path(t)-path(base.t)}
function showErr(e){var m=e.message||String(e);say(m,'var(--er)');if(eng)eng.say('ERROR '+m)}
function tick(px){eng.step(px);
  if(prog&&!eng.halt){try{if(prog.has('OnTick'))prog.run('OnTick');else if(prog.has('start'))prog.run('start')}catch(e){showErr(e);prog=null}}
  eq[eng.k-1]=eng.equity()}
function build(to){eng=new MQL.Engine(cfg());eq=[];prog=null;
  try{prog=MQL.load(cm.getValue(),eng);if(prog.has('OnInit'))prog.run('OnInit')}catch(e){showErr(e);prog=null}
  for(var i=0;i<to;i++)tick(tape[i]);pos=to}
function advance(px){if(pos<tape.length)px=tape[pos];else tape.push(px);tick(px);pos++}
function nextPx(){return pos<tape.length?tape[pos]:(auto?autoPx(pos):eng.bid)}
function stats(){var e=eq.length?eq[eq.length-1]:sim.balance,pk=-1e18,dd=0;eq.forEach(function(v){if(v>pk)pk=v;if(pk-v>dd)dd=pk-v});return{p:e-sim.balance,dd:dd,lot:eng.maxLot,n:eng.nOpen}}

function frame(ts){if(!running)return;var dt=Math.min(ts-lastTs,100);lastTs=ts;acc+=dt/1000*speed;var n=Math.min(Math.floor(acc),300);acc-=n;
  for(var i=0;i<n;i++)advance(nextPx());if(n){setSlider();draw()}requestAnimationFrame(frame)}

function back(){play(false);var ev=eng.ev.filter(function(e){return e<pos});build(ev.length?ev[ev.length-1]:0);setSlider();draw()}
function fwd(){play(false);var n0=eng.ev.length,i=0;while(i++<5000&&eng.ev.length===n0&&!eng.halt){if(pos>=tape.length&&!auto)break;advance(nextPx())}setSlider();draw()}

function draw(){
  var cv=$('#cv'),W=cv.clientWidth,H=cv.clientHeight,d=window.devicePixelRatio||1,g,i;
  if(W&&H){

    var nc=Math.max(1,Math.ceil(pos/60)),cs=[],hi=-1e18,lo=1e18;

    hi=Math.max(hi,eng.ask());lo=Math.min(lo,eng.bid);eng.o.forEach(function(o){hi=Math.max(hi,o.open);lo=Math.min(lo,o.open)});

    var line=function(v,col,dash,lab){g.strokeStyle=col;g.setLineDash(dash);g.beginPath();g.moveTo(0,Y(v));g.lineTo(W-52,Y(v));g.stroke();g.setLineDash([]);if(lab){g.fillStyle=col;g.font='10px system-ui';g.fillText(lab,W-50,Y(v)+3)}};
    var NM=['Buy','Sell','BuyLmt','SellLmt','BuyStp','SellStp'];
    eng.o.forEach(function(o){line(o.open,o.type%2===0?'#5aa9ff':'#ff6b81',o.type>1?[5,3]:[],NM[o.type]);if(o.sl)line(o.sl,'#9aa8ba',[1,3]);if(o.tp)line(o.tp,'#9aa8ba',[1,3])});
    line(eng.bid,'#e3a73c',[2,2],eng.bid.toFixed(sim.digits))}
  var q=$('#cq'),qw=q.clientWidth,qh=q.clientHeight;
  if(qw&&qh){if(q.width!==Math.round(qw*d)){q.width=Math.round(qw*d);q.height=Math.round(qh*d)}
    g=q.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,qw,qh);
    var A=eq,B2=ghost?ghost.eq:[],mn=sim.balance,mx=sim.balance,len=Math.max(A.length,B2.length,60);
    A.concat(B2).forEach(function(v){if(v<mn)mn=v;if(v>mx)mx=v});if(mx-mn<1e-9){mx+=1;mn-=1}
    var pl=function(arr,col,dash){if(!arr.length)return;g.strokeStyle=col;g.setLineDash(dash);g.beginPath();arr.forEach(function(v,k){var x=k/(len-1)*(qw-2)+1,y=qh-3-(v-mn)/(mx-mn)*(qh-6);k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.setLineDash([])};
    g.strokeStyle='#2a3646';g.beginPath();var y0=qh-3-(sim.balance-mn)/(mx-mn)*(qh-6);g.moveTo(0,y0);g.lineTo(qw,y0);g.stroke();
    pl(B2,'#8a97a9',[3,3]);pl(A,'#e7ecf3',[])}
  var fl=eng.equity()-eng.bal,lots=0;eng.o.forEach(function(o){if(o.type<2)lots+=o.lots});
  $('#ix').textContent='Bid '+eng.bid.toFixed(sim.digits)+'  Ask '+eng.ask().toFixed(sim.digits)+'  Bal '+eng.bal.toFixed(2)+'  Eq '+eng.equity().toFixed(2)+'  Float '+f2(fl)+'  Order '+eng.o.length+'  Lot '+lots.toFixed(2)+'  Tick '+pos+' ('+(pos/60).toFixed(1)+'M)';
  var s=stats(),t='Sekarang: P/L '+f2(s.p)+'  DD '+s.dd.toFixed(2)+'  Lot maks '+s.lot.toFixed(2)+'  Order '+s.n;
  if(ghost)t+='\nSebelumnya: P/L '+f2(ghost.s.p)+'  DD '+ghost.s.dd.toFixed(2)+'  Lot maks '+ghost.s.lot.toFixed(2)+'  Order '+ghost.s.n+'\nSelisih: P/L '+f2(s.p-ghost.s.p)+'  DD '+f2(s.dd-ghost.s.dd)+'  Order '+(s.n-ghost.s.n>=0?'+':'')+(s.n-ghost.s.n);
  if(eng.cmt)t+='\n'+eng.cmt.replace(/\n/g,' | ').slice(0,120);
  $('#sx').textContent=t}

/* ---------- setelan, log, tombol ---------- */
var SF=[['price','Harga awal'],['spread','Spread (poin)'],['delay','Delay eksekusi (ms)'],['balance','Balance awal'],['digits','Digits'],['point','Point'],['contract','Ukuran kontrak'],['lotMin','Lot min'],['lotStep','Lot step'],['lotMax','Lot maks'],['stopLevel','Stop level (poin)'],['leverage','Leverage'],['range','Rentang slider (±USD)'],['ampl','Amplitudo auto (USD)'],['period','Periode (tick)'],['drift','Drift (USD/100 tick)'],['seed','Seed acak']];
function setUI(){modal('Pengaturan simulasi',function(m){var ins={},g=el('div',{className:'gr'});
  SF.forEach(function(f){var i=el('input',{type:'number',value:sim[f[0]],step:'any'});i.inputMode='decimal';ins[f[0]]=i;g.appendChild(el('div',{},[el('label',{textContent:f[1]}),i]))});
  var pl=el('select',{});[['zigzag','Pola auto: zigzag'],['acak','Pola auto: acak (seed)']].forEach(function(v){pl.appendChild(el('option',{value:v[0],textContent:v[1]}))});pl.value=sim.pola;pl.style.marginTop='8px';
  m.appendChild(g);m.appendChild(pl);
  m.appendChild(el('div',{className:'mu',textContent:'Default XAUUSD Exness: 3 digit, point 0.001, kontrak 100. Cek Specification di MT4-mu. Delay: order terisi di harga setelah X ms (kecepatan harga x delay).'}));
  m.appendChild(el('div',{className:'bt'},[btn('Batal',close),btn('Simpan dan reset',function(){SF.forEach(function(f){var v=parseFloat(ins[f[0]].value);if(!isNaN(v))sim[f[0]]=v});sim.pola=pl.value;
    ['point','lotStep','contract','leverage','period','lotMin','lotMax','range','price'].forEach(function(k){if(!(sim[k]>0))sim[k]=SD[k]});sim.digits=Math.max(0,Math.round(sim.digits));S.sim=sim;persist();close();reset()},'ok')]))})}
function logUI(){modal('Log EA',function(m){var L=eng.log.slice(-80).reverse();if(!L.length)m.appendChild(el('div',{className:'mu',textContent:'Belum ada log.'}));L.forEach(function(x){m.appendChild(el('div',{className:'r',textContent:x}))});m.appendChild(btn('Tutup',close))})}
$('#sl').addEventListener('input',function(){manual(sim.price+this.value*sim.point)});
$('#sm').addEventListener('click',function(){manual(eng.bid-$('#ss').value*sim.point)});
$('#sp').addEventListener('click',function(){manual(eng.bid+$('#ss').value*sim.point)});
$('#sv').addEventListener('input',function(){speed=+this.value;$('#svl').textContent=speed+'/dtk'});
$('#bPlay').addEventListener('click',function(){play(!running)});
$('#bAuto').addEventListener('click',function(){setAuto(!auto)});
$('#bBack').addEventListener('click',back);$('#bFwd').addEventListener('click',fwd);
$('#bSet').addEventListener('click',setUI);$('#bLog').addEventListener('click',logUI);
$('#bMin').addEventListener('click',function(){var p=$('#pv');p.classList.toggle('min');this.textContent=p.classList.contains('min')?'Buka':'Lipat';draw()});
$('#bReset').addEventListener('click',async function(){if(pos>0&&!(await ask('Reset simulasi? Pergerakan harga yang direkam dihapus.','Ya, reset')))return;reset()});
window.addEventListener('resize',draw);
window.__jz={advance:function(n){for(var i=0;i<n;i++)advance(nextPx())},st:function(){return{pos:pos,eq:eq.length,bal:eng.bal,o:eng.o.length,ev:eng.ev.slice(),err:prog?0:1}},reset:reset,back:back,fwd:fwd,rerun:rerun,manual:manual,eng:function(){return eng}};
reset();refresh();

})();
