name: Build JefzExpert APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan proyek Android (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.jefz.expert",
            "appName": "JefzExpert",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JefzExpert.apk
          gh release create "build-${{ github.run_number }}" JefzExpert.apk \
            --title "JefzExpert build ${{ github.run_number }}" \
            --notes "Tahap 1: editor MQL4, template, generator Grid+Marti+trailing, ekspor .mq4."
