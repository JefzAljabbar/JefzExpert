name: Build JefzExpert APK

# APK ini hanya cangkang yang membuka https://jefzaljabbar.github.io/JefzExpert/
# Mengubah index.html TIDAK perlu build ulang. Build hanya jalan manual atau saat file ini berubah.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Keystore tetap (agar APK bisa di-update tanpa uninstall)
        run: |
          if [ ! -f jefz.keystore ]; then
            keytool -genkeypair -keystore jefz.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=JefzExpert,O=Jefz,C=ID"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add jefz.keystore
            git commit -m "Tambah keystore tetap"
            git push
          fi
          mkdir -p ~/.android
          cp jefz.keystore ~/.android/debug.keystore

      - name: Siapkan proyek Android (Capacitor)
        run: |
          mkdir -p www
          echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JefzExpert</title><body style="background:#131a24;color:#8a97a9;font:16px sans-serif;padding:24px">Memuat JefzExpert...</body>' > www/index.html
          echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JefzExpert</title><body style="background:#131a24;color:#e7ecf3;font:16px sans-serif;padding:24px"><h3>JefzExpert belum bisa dimuat</h3><p>Pembukaan pertama butuh internet. Setelah sekali terbuka, app tersimpan dan bisa dipakai offline.</p></body>' > www/error.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.jefz.expert",
            "appName": "JefzExpert",
            "webDir": "www",
            "server": {
              "url": "https://jefzaljabbar.github.io/JefzExpert/",
              "errorPath": "error.html",
              "cleartext": false
            },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          npx cap sync android
          VC=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode 1/versionCode $VC/; s/versionName \"1.0\"/versionName \"1.0.$VC\"/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JefzExpert.apk
          gh release create "build-${{ github.run_number }}" JefzExpert.apk \
            --title "JefzExpert build ${{ github.run_number }}" \
            --notes "Cangkang APK: memuat situs Pages. Update HTML tidak perlu APK baru."
